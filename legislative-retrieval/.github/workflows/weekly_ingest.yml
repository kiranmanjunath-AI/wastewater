name: Weekly ITA Ingestion

on:
  schedule:
    - cron: '0 3 * * 1'   # 3:00 AM UTC every Monday
  workflow_dispatch:        # Allow manual trigger

jobs:
  ingest:
    name: Check and ingest latest ITA version
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -sf http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: legislation_chunks
      DB_PATH: ./data/version_index.db
      DATA_DIR: ./data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && echo "Qdrant ready" && break
            echo "Waiting for Qdrant... attempt $i"
            sleep 5
          done

      - name: Fetch ITA XML and check for new version
        id: check_version
        run: |
          python - <<'EOF'
          import os, sys, json
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv()

          from ingestion.fetch_ita import fetch_all
          from db.version_index import version_exists

          results = fetch_all(["en"])
          en = results["en"]
          new_hash = en["version_hash"]

          already_ingested = version_exists(new_hash, act="ITA", language="en")
          print(f"version_hash={new_hash}")
          print(f"already_ingested={already_ingested}")

          # Write outputs for subsequent steps
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_version={'false' if already_ingested else 'true'}\n")
              f.write(f"version_hash={new_hash}\n")
          EOF

      - name: Run full ingestion (English)
        if: steps.check_version.outputs.new_version == 'true'
        id: ingest_en
        run: |
          python - <<'EOF'
          import json, os
          from datetime import date
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv()

          from ingestion.chunk_statute import parse_ita_xml
          from ingestion.load_qdrant import run_ingestion
          from ingestion.fetch_ita import compute_hash, extract_consolidation_date

          xml_path = Path("./data/ita_en.xml")
          raw = xml_path.read_bytes()
          xml_hash = compute_hash(raw)
          consolidated_as_of = extract_consolidation_date(raw) or str(date.today())

          chunks = parse_ita_xml(
              xml_path=xml_path,
              language="en",
              valid_from=consolidated_as_of,
              amending_act=os.getenv("AMENDING_ACT", ""),
          )

          summary = run_ingestion(
              chunks=chunks,
              language="en",
              act="ITA",
              consolidated_as_of=consolidated_as_of,
              amending_act=os.getenv("AMENDING_ACT", ""),
              source_url="https://laws-lois.justice.gc.ca/eng/XML/I-3.3.xml",
              xml_version_hash=xml_hash,
          )

          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"consolidated_as_of={summary['consolidated_as_of']}\n")
              f.write(f"amending_act={summary.get('amending_act', '')}\n")
              f.write(f"chunks_added={summary['chunks_added']}\n")
              f.write(f"chunks_removed={summary['chunks_removed']}\n")
              f.write(f"chunk_count={summary['chunk_count']}\n")
          EOF

      - name: Run full ingestion (French)
        if: steps.check_version.outputs.new_version == 'true'
        run: |
          python - <<'EOF'
          import json, os
          from datetime import date
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv()

          from ingestion.fetch_ita import fetch_all, compute_hash, extract_consolidation_date
          from ingestion.chunk_statute import parse_ita_xml
          from ingestion.load_qdrant import run_ingestion

          results = fetch_all(["fr"])
          if "fr" not in results:
              print("FR download failed, skipping.")
          else:
              fr = results["fr"]
              xml_path = fr["path"]
              raw = xml_path.read_bytes()
              xml_hash = compute_hash(raw)
              consolidated_as_of = fr.get("consolidated_as_of") or extract_consolidation_date(raw) or str(date.today())
              chunks = parse_ita_xml(
                  xml_path=xml_path,
                  language="fr",
                  valid_from=consolidated_as_of,
                  amending_act=os.getenv("AMENDING_ACT", ""),
              )
              summary = run_ingestion(
                  chunks=chunks,
                  language="fr",
                  act="ITA",
                  consolidated_as_of=consolidated_as_of,
                  amending_act=os.getenv("AMENDING_ACT", ""),
                  source_url=fr["url"],
                  xml_version_hash=xml_hash,
              )
              print(json.dumps(summary, indent=2))
          EOF

      - name: Send alert email (new version detected)
        if: steps.check_version.outputs.new_version == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.OPERATOR_EMAIL }}
          from: Legislative Retrieval CI <${{ secrets.MAIL_USERNAME }}>
          subject: "ITA updated: new version ingested (${{ steps.ingest_en.outputs.consolidated_as_of }})"
          body: |
            A new version of the Canadian Income Tax Act has been detected and ingested.

            Consolidated as of: ${{ steps.ingest_en.outputs.consolidated_as_of }}
            Amending act:       ${{ steps.ingest_en.outputs.amending_act }}

            Chunk delta:
              Added:    ${{ steps.ingest_en.outputs.chunks_added }}
              Removed:  ${{ steps.ingest_en.outputs.chunks_removed }}
              Total:    ${{ steps.ingest_en.outputs.chunk_count }}

            Source: https://laws-lois.justice.gc.ca/eng/XML/I-3.3.xml

            Ingestion ran automatically via GitHub Actions.

      - name: No new version — skip
        if: steps.check_version.outputs.new_version == 'false'
        run: echo "No new ITA version detected. Ingestion skipped."
